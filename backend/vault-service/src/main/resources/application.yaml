server:
  port: 8082

spring:
  application:
    name: vault-service

  datasource:
    url: jdbc:mysql://localhost:3307/vault_db
    username: ${VAULT_DB_USERNAME}
    password: ${VAULT_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true

  flyway:
    enabled: true

  data:
    mongodb:
      host: localhost
      port: 27018
      database: vault_db
      username: ${MONGO_INITDB_ROOT_USERNAME}
      password: ${MONGO_INITDB_ROOT_PASSWORD}
      authentication-database: admin