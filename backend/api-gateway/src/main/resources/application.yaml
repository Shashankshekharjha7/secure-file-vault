server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        web flux:
          routes:
            - id: auth-service-route
              uri: lb://AUTH-SERVICE
              predicates:
                -path=/api/auth/**


eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka