services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in infra/.env}
      VAULT_DB_USERNAME: ${VAULT_DB_USERNAME:?Set VAULT_DB_USERNAME in infra/.env}
      VAULT_DB_PASSWORD: ${VAULT_DB_PASSWORD:?Set VAULT_DB_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./mysql-init.sh:/docker-entrypoint-initdb.d/20-create-app-user.sh:ro

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Set MONGO_INITDB_ROOT_USERNAME in infra/.env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mysql-data:
  mongo-data: